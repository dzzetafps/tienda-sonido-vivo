<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar producto | Sonido Vivo</title>

    <link rel="stylesheet" href="../assets/css/base.css">

    <script src="../assets/js/data/productos.js" defer></script>
    <script src="../assets/js/admin-auth.js" defer></script>
    <script src="../assets/js/admin.js" defer></script>
</head>

<body class="admin">

    <header class="encabezado-sitio admin-encabezado">

        <div class="contenedor barra-navegacion">

            <a class="marca" href="./index.html">

                <span class="marca__simbolo">SV</span>

                <span class="marca__texto">
                    <strong>Sonido Vivo</strong>
                    <small>Área administrativa</small>
                </span>

            </a>

            <nav class="navegacion-principal admin-navegacion">

                <ul>
                    <li><a href="./index.html">Dashboard</a></li>
                    <li><a href="./productos.html">Productos</a></li>
                    <li><a href="./usuarios.html">Usuarios</a></li>
                    <li><a href="../index.html">Volver a la tienda</a></li>

                </ul>

            </nav>

        </div>

    </header>


    <main
        class="contenedor seccion admin-contenido"
        id="contenido-principal">

        <h1>Editar producto</h1>

        <p>
            Modifica los datos del producto seleccionado.
        </p>


        <form
            id="formulario-producto"
            class="admin-formulario"
            data-modo="editar">


            <div class="admin-campo">

                <label for="codigo">
                    Código
                </label>

                <input
                    type="text"
                    id="codigo"
                    name="codigo"
                    readonly>

            </div>


            <div class="admin-campo">

                <label for="categoria">
                    Categoría
                </label>

                <select
                    id="categoria"
                    name="categoria"
                    required>

                    <option value="">
                        Seleccione una categoría
                    </option>

                </select>

            </div>


            <div class="admin-campo">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    required>

            </div>


            <div class="admin-campo">

                <label for="marca">
                    Marca
                </label>

                <input
                    type="text"
                    id="marca"
                    name="marca"
                    required>

            </div>


            <div class="admin-campo">

                <label for="modelo">
                    Modelo
                </label>

                <input
                    type="text"
                    id="modelo"
                    name="modelo"
                    required>

            </div>


            <div class="admin-campo">

                <label for="precio">
                    Precio (CLP)
                </label>

                <input
                    type="number"
                    id="precio"
                    name="precio"
                    min="0"
                    step="1"
                    required>

            </div>


            <div class="admin-campo">

                <label for="stock">
                    Stock
                </label>

                <input
                    type="number"
                    id="stock"
                    name="stock"
                    min="0"
                    step="1"
                    required>

            </div>


            <div class="admin-campo">

                <label for="descripcion">
                    Descripción
                </label>

                <textarea
                    id="descripcion"
                    name="descripcion"
                    rows="5"
                    required></textarea>

            </div>


            <div class="admin-acciones">

                <button
                    class="boton boton--primario"
                    type="submit"
                    id="guardar-producto">

                    Guardar cambios

                </button>

                <a href="./productos.html">
                    Cancelar
                </a>

            </div>

        </form>

    </main>


    <footer class="pie-sitio admin-pie">

        <div class="contenedor">
            <p>Sonido Vivo · Área administrativa</p>
        </div>

    </footer>

</body>

</html>
